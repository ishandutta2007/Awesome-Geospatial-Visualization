<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <style>
      .radar-sweep {
        transform-origin: 980px 180px;
        animation: rotateSweep 8s linear infinite;
      }
      @keyframes rotateSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .pulse-ring {
        animation: pulseEffect 3s ease-out infinite;
        transform-origin: center;
      }
      .pulse-ring-delayed {
        animation: pulseEffect 3s ease-out infinite 1.5s;
        transform-origin: center;
      }
      @keyframes pulseEffect {
        0% { r: 6px; opacity: 1; }
        100% { r: 38px; opacity: 0; stroke-width: 0.5px; }
      }

      .flow-line {
        stroke-dasharray: 8 12;
        animation: dashStream 25s linear infinite;
      }
      .flow-line-rev {
        stroke-dasharray: 6 10;
        animation: dashStreamRev 20s linear infinite;
      }
      @keyframes dashStream {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes dashStreamRev {
        to { stroke-dashoffset: 1000; }
      }

      .node-beacon {
        animation: beaconGlow 2s ease-in-out infinite alternate;
      }
      @keyframes beaconGlow {
        0% { opacity: 0.4; filter: drop-shadow(0 0 2px #38bdf8); }
        100% { opacity: 1; filter: drop-shadow(0 0 8px #00f5d4); }
      }

      .hex-pulse {
        animation: hexShimmer 4s ease-in-out infinite alternate;
      }
      @keyframes hexShimmer {
        0% { opacity: 0.15; }
        100% { opacity: 0.5; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGradient)"/>

  <!-- Geospatial Coordinate Grid Pattern -->
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="180" fill="#0284c7" opacity="0.12" filter="url(#glow)"/>
  <circle cx="980" cy="180" r="160" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>

  <!-- Geometric & Hexagonal Spatial Density Cells (Background layer) -->
  <g class="hex-pulse" stroke="#38bdf8" stroke-width="1" fill="none">
    <!-- Hex 1 -->
    <polygon points="860,110 885,95 910,110 910,140 885,155 860,140" fill="#0284c7" fill-opacity="0.1"/>
    <!-- Hex 2 -->
    <polygon points="910,80 935,65 960,80 960,110 935,125 910,110" fill="#38bdf8" fill-opacity="0.15"/>
    <!-- Hex 3 -->
    <polygon points="960,110 985,95 1010,110 1010,140 985,155 960,140" fill="#6366f1" fill-opacity="0.12"/>
    <!-- Hex 4 -->
    <polygon points="910,140 935,125 960,140 960,170 935,185 910,170" fill="#818cf8" fill-opacity="0.2"/>
    <!-- Hex 5 -->
    <polygon points="860,170 885,155 910,170 910,200 885,215 860,200" fill="#0284c7" fill-opacity="0.08"/>
    <!-- Hex 6 -->
    <polygon points="1010,80 1035,65 1060,80 1060,110 1035,125 1010,110" fill="#0ea5e9" fill-opacity="0.15"/>
  </g>

  <!-- Interactive Globe / Radar HUD Rings (Right side graphic, non-obtrusive) -->
  <g opacity="0.8">
    <circle cx="980" cy="180" r="130" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="980" cy="180" r="95" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="980" cy="180" r="60" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="980" cy="180" r="25" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Crosshairs & Latitude/Longitude Ticks -->
    <line x1="830" y1="180" x2="1130" y2="180" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.4" stroke-dasharray="6 4"/>
    <line x1="980" y1="30" x2="980" y2="330" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.4" stroke-dasharray="6 4"/>
    <ellipse cx="980" cy="180" rx="130" ry="50" fill="none" stroke="#0ea5e9" stroke-width="0.75" stroke-opacity="0.35"/>
    <ellipse cx="980" cy="180" rx="60" ry="130" fill="none" stroke="#6366f1" stroke-width="0.75" stroke-opacity="0.35"/>

    <!-- Radar Scanning Beam (Dynamic) -->
    <g class="radar-sweep">
      <path d="M 980 180 L 1110 180 A 130 130 0 0 0 1072 88 Z" fill="url(#radarSweep)"/>
      <line x1="980" y1="180" x2="1110" y2="180" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
    </g>

    <!-- Radar Center Pulsing Rings -->
    <circle cx="980" cy="180" r="6" fill="#38bdf8"/>
    <circle cx="980" cy="180" class="pulse-ring" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="980" cy="180" class="pulse-ring-delayed" fill="none" stroke="#00f5d4" stroke-width="1.5"/>
  </g>

  <!-- Dynamic Spatial Arc / Trajectory Lines (Background paths) -->
  <g fill="none">
    <!-- Arc 1 -->
    <path class="flow-line" d="M 80,310 C 260,240 450,330 650,290 C 850,250 900,190 980,180" 
          stroke="#00f5d4" stroke-width="1.75" stroke-opacity="0.6"/>
    <!-- Arc 2 -->
    <path class="flow-line-rev" d="M 120,40 C 350,110 600,10 820,90 C 900,120 950,160 980,180" 
          stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Arc 3 -->
    <path class="flow-line" d="M 400,340 C 580,260 760,280 980,180" 
          stroke="#a855f7" stroke-width="1.25" stroke-opacity="0.5"/>
  </g>

  <!-- Network Geo-Nodes (Beacons) -->
  <g class="node-beacon">
    <circle cx="480" cy="285" r="4" fill="#00f5d4"/>
    <circle cx="480" cy="285" r="9" fill="none" stroke="#00f5d4" stroke-width="0.8" opacity="0.6"/>

    <circle cx="680" cy="115" r="3.5" fill="#38bdf8"/>
    <circle cx="890" cy="225" r="4.5" fill="#818cf8"/>
    <circle cx="1060" cy="140" r="3" fill="#38bdf8"/>
    <circle cx="1020" cy="250" r="3.5" fill="#00f5d4"/>
  </g>

  <!-- Top / Bottom Accent Framing Borders -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#cyanGlow)"/>
  <rect x="0" y="357" width="1200" height="3" fill="url(#cyanGlow)"/>

  <!-- ================= FOREGROUND BRANDING CONTENT ================= -->
  <!-- Translucent backing panel behind text ensures complete readability -->
  <rect x="52" y="42" width="690" height="276" rx="16" fill="#070b14" fill-opacity="0.82" stroke="#1e293b" stroke-width="1"/>

  <!-- Category Badge Pill -->
  <g transform="translate(76, 68)">
    <rect width="194" height="28" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#00f5d4">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="18.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="0.8">CURATED ECOSYSTEM</text>
  </g>

  <!-- Edition / Freshness Pill -->
  <g transform="translate(280, 68)">
    <rect width="138" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="14" y="18.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="12" font-weight="600" fill="#c7d2fe" letter-spacing="0.5">UPDATED 2026</text>
  </g>

  <!-- Main Repository Title (Crisp, High Contrast, Foreground Guaranteed) -->
  <text x="76" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="38" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5" filter="url(#softGlow)">
    Awesome Geospatial Visualization
  </text>

  <!-- Subtitle / Value Proposition -->
  <text x="76" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="16.5" font-weight="500" fill="#e2e8f0" letter-spacing="0.2">
    Interactive Web Maps • Large-Scale Spatial Analytics • GIS Platforms
  </text>

  <!-- Descriptive Subtext -->
  <text x="76" y="218" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="13.5" font-weight="400" fill="#94a3b8">
    Enterprise SaaS platforms, cloud data warehouse connectors &amp; open-source stacks
  </text>

  <!-- Feature / Tech Stack Badges -->
  <g transform="translate(76, 248)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="102" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="10" y="17" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8">WebGL / GPU</text>

    <!-- Pill 2 -->
    <rect x="110" y="0" width="98" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="10" y="17" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#a78bfa" transform="translate(110, 0)">Vector Tiles</text>

    <!-- Pill 3 -->
    <rect x="216" y="0" width="86" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="10" y="17" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#34d399" transform="translate(216, 0)">3D Globes</text>

    <!-- Pill 4 -->
    <rect x="310" y="0" width="112" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="10" y="17" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#f472b6" transform="translate(310, 0)">Desktop GIS</text>

    <!-- Pill 5 -->
    <rect x="430" y="0" width="104" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="10" y="17" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#fbbf24" transform="translate(430, 0)">OGC Services</text>

    <!-- Pill 6 -->
    <rect x="542" y="0" width="104" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="10" y="17" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8" transform="translate(542, 0)">Spatial SQL</text>
  </g>
</svg>
